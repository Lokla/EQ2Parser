name: Release

# Tests, builds and publishes an attested, checksummed EQ2Parser release from
# CI. This is the only way to publish (scripts/release.ps1 packs locally only).
#
#   * push a tag `vX.Y.Z`      -> builds, attests, and PUBLISHES a release
#   * run manually (dispatch)  -> builds + attests, uploads the installer +
#                                 checksums as run artifacts; only publishes if
#                                 you tick `publish`
#
# INTERIM (no code signing): integrity comes from build-provenance attestation
# (proves the binary was built from this repo in CI) + a published SHA256SUMS.txt.
# Users get a one-time SmartScreen warning. To add a real Authenticode signature
# later (Certum, ~$58/yr) see docs/code-signing.md — the
# signing step slots in between "Pack" and "Attest". The prior SignPath wiring is
# in this file's git history (the "interim switch" commit).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0 (manual runs only).'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub Release (leave off for a build-only test run).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for build-provenance attestation
  attestations: write # write the attestation

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          } else {
            $v = '${{ inputs.version }}'
          }
          if (-not $v) { throw 'No version resolved.' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The same gate as ci.yml. A tag publishes to every installed copy
      # through auto-update and cannot be recalled, so it must not be able
      # to ship a commit that does not build clean and pass its tests.
      - name: Build
        run: dotnet build --configuration Release

      - name: Format
        run: dotnet format EQ2Parser.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Install Velopack (vpk)
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Publish (self-contained win-x64)
        shell: pwsh
        run: >
          dotnet publish src/EQ2Parser.App -c Release -r win-x64 --self-contained true
          -o publish /p:Version=${{ steps.ver.outputs.version }}

      # The v0.2.5 regression, checked on the artifact that ships: MSBuild
      # once routed the strings.*.json dictionaries into satellite assemblies
      # and the published app rendered every label as its raw key. The unit
      # test for this reads bin/, not the self-contained publish output.
      - name: Verify language dictionaries are embedded
        shell: pwsh
        run: |
          $stream = [System.IO.File]::OpenRead((Resolve-Path 'publish/EQ2Parser.App.dll'))
          try {
            $pe = [System.Reflection.PortableExecutable.PEReader]::new($stream)
            $md = [System.Reflection.Metadata.PEReaderExtensions]::GetMetadataReader($pe)
            $names = @($md.ManifestResources | ForEach-Object { $md.GetString($md.GetManifestResource($_).Name) })
          } finally { $stream.Dispose() }
          $missing = @('en', 'de', 'fr', 'ru' |
            ForEach-Object { "EQ2Parser.App.Localization.strings.$_.json" } |
            Where-Object { $names -notcontains $_ })
          if ($missing) {
            throw "Not embedded in the published EQ2Parser.App.dll: $($missing -join ', '). Check WithCulture=false on the EmbeddedResource item in EQ2Parser.App.csproj."
          }
          Write-Host "All four language dictionaries are embedded."

      - name: Pack (Velopack)
        shell: pwsh
        run: >
          vpk pack --packId EQ2Parser --packVersion ${{ steps.ver.outputs.version }}
          --packDir publish --mainExe EQ2Parser.App.exe --packTitle EQ2Parser
          --outputDir Releases --icon src/EQ2Parser.App/Assets/EQ2Parser.ico

      # Publish checksums so a download can be verified without a code signature.
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem Releases -Include *.exe, *.nupkg -Recurse
          if (-not $files) { throw 'No release artifacts to checksum.' }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Set-Content -Path Releases/SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA256SUMS.txt:"; Get-Content Releases/SHA256SUMS.txt

      # Build-provenance attestation (the repo is public, so this succeeds):
      # cryptographic proof the binary was built from this repo in CI.
      # continue-on-error stays as a belt-and-braces net. SHA256SUMS.txt
      # complements it.
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            Releases/EQ2Parser-win-Setup.exe
            Releases/*.nupkg

      # Test run (manual, publish off): keep the installer + checksums as run
      # artifacts for verification without shipping anything.
      - name: Upload build artifacts (test run)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: eq2parser-setup
          path: |
            Releases/EQ2Parser-win-Setup.exe
            Releases/SHA256SUMS.txt

      # Real release (tag push, or manual with publish ticked). Published as a
      # full release, never a pre-release: the in-app updater reads stable
      # releases from this repo (GithubSource prerelease: false).
      # The feed is this repo. Same-repo publish uses the workflow's own
      # GITHUB_TOKEN (contents:write granted above), so no PAT is involved.
      # (Until v0.5.7 a second copy also went to the old EQ2Parser-releases
      # repo for installs on v0.3.2 or earlier; v0.5.7 there still moves any
      # such install onto this feed.)
      - name: Publish GitHub Release (main repo)
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: pwsh
        run: >
          vpk upload github --repoUrl https://github.com/VortexUK/EQ2Parser
          --publish --releaseName "EQ2Parser ${{ steps.ver.outputs.version }}"
          --tag "v${{ steps.ver.outputs.version }}"
          --token ${{ secrets.GITHUB_TOKEN }} --outputDir Releases

      - name: Attach checksums to release (main repo)
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "v${{ steps.ver.outputs.version }}" Releases/SHA256SUMS.txt
          --clobber -R VortexUK/EQ2Parser
